name: Profile quality gate

# Private preview repositories may have GitHub-hosted runners unavailable.
# Keep this manual during staging; enable push/pull_request triggers after
# the final public profile repository is published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate profile assets and references
        run: python3 scripts/check_profile.py
