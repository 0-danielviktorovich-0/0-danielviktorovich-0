<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Kamyshan — Entrepreneur, Product Builder and Developer</title>
  <desc id="desc">Technical profile banner for Daniel Kamyshan in Tokyo, focused on AI automation, product engineering, web, mobile and desktop software.</desc>
