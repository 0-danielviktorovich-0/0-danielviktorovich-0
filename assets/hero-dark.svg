<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Kamyshan — Entrepreneur, Product Builder and Developer</title>
  <desc id="desc">Daniel Kamyshan in Tokyo. Building AI automation, full-stack, web, mobile and desktop software. Current work: RimLoc and BookKeeper. Two upstream open-source merges and one published CLI crate.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" x2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="58%" stop-color="#8b5cf6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.038" stroke-width="1"/>
    </pattern>
    <style>
      .status-pulse { animation: statusPulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes statusPulse { 0%,100% { opacity:1 } 50% { opacity:.38 } }
      @media (prefers-reduced-motion: reduce) { .status-pulse { animation:none } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="26" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="22" y="22" width="1156" height="396" rx="20" fill="#111827" stroke="#30363d"/>
  <rect x="22" y="22" width="1156" height="396" rx="20" fill="url(#grid)"/>
  <path d="M22 264 C284 190 493 312 720 208 C869 140 1035 108 1178 134 L1178 418 L22 418 Z" fill="url(#wash)"/>

  <g>
    <rect x="64" y="55" width="208" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <circle cx="82" cy="70" r="4" fill="#2dd4bf" class="status-pulse"/>
    <text x="96" y="75" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.35">TOKYO · UTC+9</text>

    <text x="64" y="157" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="760" letter-spacing="-1.8">DANIEL KAMYSHAN</text>
    <text x="66" y="198" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" letter-spacing="2.25">ENTREPRENEUR · PRODUCT BUILDER · DEVELOPER</text>

    <rect x="66" y="229" width="470" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="66" y="278" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">From idea to working product.</text>
    <text x="66" y="312" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Software · AI automation · Web · Mobile · Desktop</text>
  </g>

  <g transform="translate(786 54)">
    <rect x="0" y="0" width="326" height="287" rx="18" fill="#0f1623" stroke="#30363d"/>
    <text x="22" y="31" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.8">NOW / SHIPPING</text>

    <circle cx="25" cy="67" r="5" fill="#2dd4bf" class="status-pulse"/>
    <text x="42" y="72" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="650">RimLoc</text>
    <text x="286" y="72" text-anchor="end" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">ACTIVE</text>
    <text x="42" y="92" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Rust · Tauri · open source</text>

    <circle cx="25" cy="127" r="5" fill="#8b5cf6"/>
    <text x="42" y="132" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="650">BookKeeper</text>
    <text x="286" y="132" text-anchor="end" fill="#8b5cf6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">BUILDING</text>
    <text x="42" y="152" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">local-first · private development</text>

    <line x1="22" y1="178" x2="304" y2="178" stroke="#30363d"/>
    <text x="22" y="204" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.4">PROOF</text>

    <text x="22" y="238" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="760">2</text>
    <text x="55" y="235" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">upstream</text>
    <text x="55" y="251" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">merges</text>

    <line x1="164" y1="218" x2="164" y2="260" stroke="#30363d"/>

    <text x="184" y="238" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="760">1</text>
    <text x="217" y="235" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">published</text>
    <text x="217" y="251" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">CLI crate</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.05">
    <rect x="64" y="356" width="142" height="32" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="80" y="376" fill="#8b949e">AI AUTOMATION</text>
    <rect x="216" y="356" width="116" height="32" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="232" y="376" fill="#8b949e">FULL-STACK</text>
    <rect x="342" y="356" width="148" height="32" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="358" y="376" fill="#8b949e">CROSS-PLATFORM</text>
    <rect x="500" y="356" width="126" height="32" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="516" y="376" fill="#8b949e">LOCAL-FIRST</text>
  </g>
</svg>