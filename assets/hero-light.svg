<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Kamyshan — Entrepreneur, Product Builder and Developer</title>
  <desc id="desc">Daniel Kamyshan in Tokyo. Building software, AI automation and digital products across web, mobile and desktop.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" x2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="58%" stop-color="#8b5cf6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0f172a" stroke-opacity="0.038" stroke-width="1"/>
    </pattern>
    <style>
      .cursor { animation: blink 1.25s steps(1,end) infinite; }
      @keyframes blink { 0%,48% { opacity:1 } 49%,100% { opacity:.18 } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation:none } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="26" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="22" y="22" width="1156" height="396" rx="20" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="22" y="22" width="1156" height="396" rx="20" fill="url(#grid)"/>
  <path d="M22 264 C284 190 493 312 720 208 C869 140 1035 108 1178 134 L1178 418 L22 418 Z" fill="url(#wash)"/>

  <g>
    <rect x="64" y="55" width="208" height="30" rx="15" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="82" cy="70" r="4" fill="#2dd4bf"/>
    <text x="96" y="75" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.35">TOKYO · UTC+9</text>

    <text x="64" y="157" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="760" letter-spacing="-1.8">DANIEL KAMYSHAN</text>
    <text x="66" y="198" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" letter-spacing="2.25">ENTREPRENEUR · PRODUCT BUILDER · DEVELOPER</text>

    <rect x="66" y="229" width="470" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="66" y="278" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">From idea to working product.</text>
    <text x="66" y="312" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Software · AI automation · Web · Mobile · Desktop</text>
  </g>

  <g transform="translate(784 54)">
    <rect x="0" y="0" width="330" height="287" rx="18" fill="#ffffff" stroke="#d0d7de"/>
    <text x="22" y="31" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.8">WHAT I DO</text>

    <text x="22" y="72" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">BUILD</text>
    <text x="92" y="72" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="650">Products people can use</text>
    <text x="92" y="93" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">web · mobile · desktop · MVPs</text>

    <line x1="22" y1="111" x2="308" y2="111" stroke="#d0d7de"/>

    <text x="22" y="145" fill="#8b5cf6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">AUTOMATE</text>
    <text x="112" y="145" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="650">Work that should run itself</text>
    <text x="112" y="166" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">AI workflows · APIs · integrations</text>

    <line x1="22" y1="184" x2="308" y2="184" stroke="#d0d7de"/>

    <text x="22" y="218" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">SHIP</text>
    <text x="78" y="218" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="650">Vertical slices, not mockups</text>
    <text x="78" y="239" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">product thinking · testing · delivery</text>

    <rect x="22" y="255" width="286" height="1" fill="#d0d7de"/>
    <text x="22" y="278" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.8" letter-spacing="1.15">OPEN TO SELECTED WORK</text>
    <rect x="192" y="267" width="7" height="12" rx="1" fill="#2dd4bf" class="cursor"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.05">
    <rect x="64" y="356" width="142" height="32" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="80" y="376" fill="#57606a">AI AUTOMATION</text>
    <rect x="216" y="356" width="116" height="32" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="232" y="376" fill="#57606a">FULL-STACK</text>
    <rect x="342" y="356" width="148" height="32" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="358" y="376" fill="#57606a">CROSS-PLATFORM</text>
    <rect x="500" y="356" width="126" height="32" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="516" y="376" fill="#57606a">LOCAL-FIRST</text>
  </g>
</svg>